[package]
name = "lsp-gpt"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lsp-server = "0.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

lsp-types = "0.97"

reqwest = { version = "0.12", features = ["blocking", "json"] }

log = "0.4"
env_logger = "0.11"

